const filterState = { search: '', mbti: '', status: '' };

function caseKey(c) { return c.conversation_id + '::' + c.mbti; }

function getRating(c) {
  const k = caseKey(c);
  if (!ratings[k]) {
    ratings[k] = {
      prescription: { rating: 0, comment: '' },
      places: c.places.map(() => ({ appropriateness: 0, reason_quality: 0, comment: '' })),
      overall_comment: '',
    };
  }
  // 길이 mismatch 보정 (혹시 과거 저장)
  while (ratings[k].places.length < c.places.length) ratings[k].places.push({ appropriateness: 0, reason_quality: 0, comment: '' });
  return ratings[k];
}

function statusOf(c) {
  const r = getRating(c);
  let total = 1 + c.places.length * 2;  // prescription + (appr + reason) per place
  let done = 0;
  if (r.prescription.rating > 0) done++;
  for (const p of r.places) {
    if (p.appropriateness > 0) done++;
    if (p.reason_quality > 0) done++;
  }
  if (done === 0) return 'todo';
  if (done === total) return 'done';
  return 'partial';
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ratings));
  showSaved();
  updateStats();
}

let saveTimer = null;
function showSaved() {
  const el = document.getElementById('save');
  el.classList.add('show');
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove('show'), 800);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function updateStats() {
  const counts = { todo: 0, partial: 0, done: 0 };
  for (const c of CASES) counts[statusOf(c)]++;
  document.getElementById('stats').innerHTML =
    '총 <b>' + CASES.length + '</b>건 · 완료 <b>' + counts.done + '</b> · 일부 <b>' + counts.partial + '</b> · 미평가 <b>' + counts.todo + '</b>';
}

function emotionsHtml(scores) {
  if (!scores) return '<div style="color:#aeaeb2;font-size:12px">감정 데이터 없음</div>';
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  return '<div class="emo-grid">' + sorted.map(([k, v]) => {
    const pct = Math.round(v * 100);
    return '<div class="emo-cell"><span class="emo-name">' + (EMOTION_KO[k] || k) + '</span>'
      + '<span class="emo-bar"><span class="emo-bar-fill" style="width:' + pct + '%"></span></span>'
      + '<span class="emo-val">' + v.toFixed(2) + '</span></div>';
  }).join('') + '</div>';
}

function prescriptionHtml(p) {
  if (!p) return '<div style="color:#aeaeb2">처방 없음</div>';
  const cat = p.category_hint ? '<span class="tag cat">cat: ' + escapeHtml(p.category_hint) + '</span>' : '';
  const must = (p.keywords_must || []).map(k => '<span class="tag must">' + escapeHtml(k) + '</span>').join('');
  const avoid = (p.keywords_avoid || []).map(k => '<span class="tag avoid">!' + escapeHtml(k) + '</span>').join('');
  const theories = (p.referenced_theories || []).map(t => '<span class="tag theory">' + escapeHtml(t) + '</span>').join('');
  const mbtiSig = (p.mbti_signals_applied || []).map(s => '<span class="tag">MBTI: ' + escapeHtml(s) + '</span>').join('');
  return '<div class="pres-text">' + escapeHtml(p.prescription_text) + '</div>'
    + '<div class="pres-rationale">' + escapeHtml(p.psych_rationale) + '</div>'
    + '<div class="pres-tags">' + cat + must + avoid + theories + mbtiSig + '</div>';
}

function starsHtml(name, current, dataAttrs) {
  let html = '<div class="stars" data-name="' + name + '"' + (dataAttrs || '') + '>';
  for (let i = 1; i <= 5; i++) {
    html += '<button data-val="' + i + '"' + (current === i ? ' class="active"' : '') + '>' + i + '</button>';
  }
  html += '</div>';
  return html;
}

function placeHtml(c, place, idx) {
  const r = getRating(c);
  const photo = place.photo
    ? '<img class="photo" src="' + escapeHtml(place.photo) + '" loading="lazy" onerror="this.classList.add(\'placeholder\');this.src=\'\';this.alt=\'사진 없음\'">'
    : '<div class="photo placeholder">사진 없음</div>';
  const distLabel = place.distance_km != null ? place.distance_km + 'km' : '';
  const meta = [place.category, distLabel, place.is_outdoor === true ? '실외' : place.is_outdoor === false ? '실내' : ''].filter(Boolean).join(' · ');
  const sim = place.similarity != null ? 'sim=' + place.similarity.toFixed(3) : '';
  const score = place.score != null ? 'score=' + place.score.toFixed(3) : '';
  const hits = place.keyword_hits ? 'hits=' + place.keyword_hits : '';
  return '<div class="place" data-place-idx="' + idx + '">'
    + photo
    + '<div class="info">'
    + '<div class="row1"><div class="name">' + escapeHtml(place.name) + '</div></div>'
    + '<div class="meta">' + escapeHtml(meta) + '</div>'
    + '<div class="addr">' + escapeHtml(place.address || '') + '</div>'
    + '<div class="atmo">' + escapeHtml(place.atmosphere_text || '') + '</div>'
    + (place.persona_reason ? '<div class="reason">💬 ' + escapeHtml(place.persona_reason) + '</div>' : '')
    + '<div class="scores">' + escapeHtml([sim, score, hits].filter(Boolean).join(' · ')) + '</div>'
    + '<div class="rate-row"><label>적절성</label>' + starsHtml('place_appr', r.places[idx].appropriateness, ' data-place-idx="' + idx + '"') + '</div>'
    + '<div class="rate-row"><label>사유 품질</label>' + starsHtml('place_reason', r.places[idx].reason_quality, ' data-place-idx="' + idx + '"') + '</div>'
    + '<div class="rate-row"><label></label><textarea class="place-comment" data-place-idx="' + idx + '" placeholder="장소별 코멘트…">' + escapeHtml(r.places[idx].comment || '') + '</textarea></div>'
    + '</div></div>';
}

function caseBodyHtml(c) {
  const r = getRating(c);
  const convHtml = c.conversation.map(m => {
    const role = m.role === 'user' ? '사용자' : 'AI';
    return '<div class="conv-msg ' + m.role + '"><span class="role">' + role + '</span>' + escapeHtml(m.content) + '</div>';
  }).join('');
  return ''
    + '<div class="section"><h3>대화</h3>' + convHtml + '</div>'
    + '<div class="section"><h3>8감정 점수</h3>' + emotionsHtml(c.emotions) + '</div>'
    + '<div class="section"><h3>처방</h3>' + prescriptionHtml(c.prescription)
    +   '<div class="rate-row"><label>처방 점수</label>' + starsHtml('pres', r.prescription.rating) + '</div>'
    +   '<div class="rate-row"><label></label><textarea class="pres-comment" placeholder="처방 코멘트…">' + escapeHtml(r.prescription.comment) + '</textarea></div>'
    + '</div>'
    + '<div class="section"><h3>추천 장소 (' + c.places.length + ')</h3><div class="place-grid">'
    + c.places.map((p, i) => placeHtml(c, p, i)).join('') + '</div></div>'
    + '<div class="section"><h3>전체 코멘트</h3><textarea class="case-comment" placeholder="이 케이스 전반에 대한 코멘트…">' + escapeHtml(r.overall_comment) + '</textarea></div>';
}

function caseHtml(c) {
  const firstUser = c.conversation.find(m => m.role === 'user')?.content || '(no user msg)';
  const status = statusOf(c);
  const r = getRating(c);
  const ratedPlaces = r.places.filter(p => p.appropriateness > 0).length;
  return '<div class="case" data-key="' + caseKey(c) + '">'
    + '<div class="case-head">'
    + '<span class="badge-mbti">' + escapeHtml(c.mbti) + '</span>'
    + '<span class="conv-id">conv#' + c.conversation_id + '</span>'
    + '<span class="first-utt">' + escapeHtml(firstUser) + '</span>'
    + '<span class="status ' + status + '">' + (status === 'todo' ? '미평가' : status === 'done' ? '완료' : ratedPlaces + '/' + c.places.length) + '</span>'
    + '<span class="arrow">▶</span>'
    + '</div>'
    + '<div class="case-body" data-rendered="0"></div>'
    + '</div>';
}

function render() {
  const q = filterState.search.trim().toLowerCase();
  const list = CASES.filter(c => {
    if (filterState.mbti && c.mbti !== filterState.mbti) return false;
    if (filterState.status && statusOf(c) !== filterState.status) return false;
    if (q) {
      const txt = c.conversation.map(m => m.content).join(' ').toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('list').innerHTML = list.map(caseHtml).join('');
  bindCases();
  updateStats();
}

function bindCases() {
  for (const el of document.querySelectorAll('.case')) {
    const key = el.dataset.key;
    const c = CASES.find(x => caseKey(x) === key);
    el.querySelector('.case-head').addEventListener('click', () => toggleCase(el, c));
  }
}

function toggleCase(el, c) {
  const body = el.querySelector('.case-body');
  if (el.classList.contains('open')) {
    el.classList.remove('open');
    return;
  }
  el.classList.add('open');
  if (body.dataset.rendered === '0') {
    body.innerHTML = caseBodyHtml(c);
    body.dataset.rendered = '1';
    bindCaseBody(el, c);
  }
}

function bindCaseBody(el, c) {
  const r = getRating(c);
  // 별점 클릭
  for (const stars of el.querySelectorAll('.stars')) {
    const name = stars.dataset.name;
    const placeIdx = stars.dataset.placeIdx ? parseInt(stars.dataset.placeIdx, 10) : null;
    for (const btn of stars.querySelectorAll('button')) {
      btn.addEventListener('click', () => {
        const val = parseInt(btn.dataset.val, 10);
        if (name === 'pres') r.prescription.rating = val;
        else if (name === 'place_appr') r.places[placeIdx].appropriateness = val;
        else if (name === 'place_reason') r.places[placeIdx].reason_quality = val;
        for (const b of stars.querySelectorAll('button')) b.classList.toggle('active', parseInt(b.dataset.val, 10) === val);
        save();
        // 헤드 상태 갱신
        const head = el.querySelector('.case-head .status');
        const newStatus = statusOf(c);
        head.className = 'status ' + newStatus;
        const ratedPlaces = r.places.filter(p => p.appropriateness > 0).length;
        head.textContent = newStatus === 'todo' ? '미평가' : newStatus === 'done' ? '완료' : ratedPlaces + '/' + c.places.length;
      });
    }
  }
  // 처방 코멘트
  const presC = el.querySelector('.pres-comment');
  if (presC) {
    presC.addEventListener('input', (e) => {
      r.prescription.comment = e.target.value;
      save();
    });
  }
  // 장소별 코멘트
  for (const ta of el.querySelectorAll('.place-comment')) {
    const idx = parseInt(ta.dataset.placeIdx, 10);
    ta.addEventListener('input', (e) => {
      r.places[idx].comment = e.target.value;
      save();
    });
  }
  // 케이스 전체 코멘트
  const caseC = el.querySelector('.case-comment');
  if (caseC) {
    caseC.addEventListener('input', (e) => {
      r.overall_comment = e.target.value;
      save();
    });
  }
}

// 필터 바인딩
document.getElementById('search').addEventListener('input', (e) => { filterState.search = e.target.value; render(); });
document.getElementById('filter-mbti').addEventListener('change', (e) => { filterState.mbti = e.target.value; render(); });
document.getElementById('filter-status').addEventListener('change', (e) => { filterState.status = e.target.value; render(); });

// MBTI 옵션 채우기
const mbtis = [...new Set(CASES.map(c => c.mbti))].sort();
const mbtiSel = document.getElementById('filter-mbti');
for (const m of mbtis) {
  const opt = document.createElement('option');
  opt.value = m; opt.textContent = m;
  mbtiSel.appendChild(opt);
}

// 다운로드
document.getElementById('dl-json').addEventListener('click', () => {
  const payload = CASES.map(c => ({
    conversation_id: c.conversation_id,
    mbti: c.mbti,
    persona_id: c.persona_id,
    rating: ratings[caseKey(c)] || null,
  }));
  download('eval_ratings.json', JSON.stringify(payload, null, 2), 'application/json');
});

document.getElementById('dl-csv').addEventListener('click', () => {
  const maxPlaces = Math.max(...CASES.map(c => c.places.length));
  const headers = ['conversation_id', 'mbti', 'persona_id', 'prescription_rating', 'prescription_comment'];
  for (let i = 1; i <= maxPlaces; i++) {
    headers.push('place_' + i + '_name', 'place_' + i + '_appropriateness', 'place_' + i + '_reason_quality', 'place_' + i + '_comment');
  }
  headers.push('overall_comment');
  const rows = [headers.join(',')];
  for (const c of CASES) {
    const r = ratings[caseKey(c)];
    const row = [c.conversation_id, csv(c.mbti), c.persona_id];
    if (r) {
      row.push(r.prescription.rating || '', csv(r.prescription.comment));
    } else {
      row.push('', '');
    }
    for (let i = 0; i < maxPlaces; i++) {
      const p = c.places[i];
      const pr = r && r.places[i];
      row.push(p ? csv(p.name) : '');
      row.push(pr ? (pr.appropriateness || '') : '');
      row.push(pr ? (pr.reason_quality || '') : '');
      row.push(pr ? csv(pr.comment) : '');
    }
    row.push(r ? csv(r.overall_comment) : '');
    rows.push(row.join(','));
  }
  download('eval_ratings.csv', '\ufeff' + rows.join('\r\n'), 'text/csv;charset=utf-8');
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('모든 평가를 지웁니다. 정말로?')) return;
  for (const k of Object.keys(ratings)) delete ratings[k];
  localStorage.removeItem(STORAGE_KEY);
  render();
});

function csv(s) {
  const v = String(s ?? '');
  if (/[",\n\r]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
  return v;
}

function download(name, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
